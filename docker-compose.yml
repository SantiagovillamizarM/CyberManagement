# Entorno de DESARROLLO de CyberManagement.
# Uso (desde la raíz del proyecto):  docker compose up -d --build
#
# Los puertos se publican solo en 127.0.0.1: nada queda expuesto a la red local.

name: cybermanagement

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Usadas por infra/postgres/init para crear la base de datos de n8n.
      N8N_DB_NAME: ${N8N_DB_NAME}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    # Lista explícita: la API solo recibe los secretos que necesita.
    # El token de Telegram NO se pasa aquí (solo lo usa n8n).
    environment:
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      REGISTRATION_CODE_PEPPER: ${REGISTRATION_CODE_PEPPER}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      STORAGE_DIR: /data/storage
      FRONTEND_DIR: /code/frontend
    # --reload: reinicia automáticamente al guardar cambios en el código.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/code/app
      - ./frontend:/code/frontend:ro
      - ./storage:/data/storage
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.4
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # URL pública del túnel HTTPS (la actualiza infra/dev-tunnel.ps1).
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      # Los workflows leen estas variables con {{ $env.NOMBRE }}. n8n 2.x bloquea ese
      # acceso por defecto; se habilita porque solo el administrador crea workflows.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      CM_API_URL: http://api:8000
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      postgres:
        condition: service_healthy

  # Túnel HTTPS gratuito de Cloudflare para que Telegram alcance a n8n en desarrollo.
  # No arranca con "docker compose up"; se usa con:  .\infra\dev-tunnel.ps1
  # La URL (https://xxxx.trycloudflare.com) cambia cada vez que se reinicia.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    # "no": un túnel hacia internet NUNCA debe reabrirse solo al reiniciar Docker.
    restart: "no"
    command: ["tunnel", "--no-autoupdate", "--url", "http://n8n:5678"]
    depends_on:
      - n8n

volumes:
  postgres_data:
  n8n_data:
